name: Test Charts

on:
  pull_request:
    types: [opened, synchronize]
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      # ignore files/dirs irrelevant for CI
      - '.asf.yaml'
      - '.gitignore'
      - '**.md'
      - '**.txt'
      # ignore .github except this workflow and the ones used transitively
      - '.github/**'
      - '!.github/workflows/test.yaml'
  push:
    paths-ignore:
      # ignore files/dirs irrelevant for CI
      - '.asf.yaml'
      - '.gitignore'
      - '**.md'
      - '**.txt'
      # ignore .github except this workflow and the ones used transitively
      - '.github/**'
      - '!.github/workflows/test.yaml'

permissions: { }

env:
  CT_IMAGE: quay.io/helmpack/chart-testing:v3.14.0
  DOCKER_COMMAND: docker run --network host --rm -w /data

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up chart-testing
        run: |
          docker pull $CT_IMAGE

      - name: Find changes (PR)
        if: github.event_name == 'pull_request'
        run: |
          changed=$($DOCKER_COMMAND -v $(pwd):/data --user $(id -u) $CT_IMAGE ct list-changed --target-branch $base_ref)
          if [[ -n "$changed" ]]; then
            echo "test_scope=--target-branch $base_ref" >> "$GITHUB_ENV"
          fi
        env:
          base_ref: ${{ github.base_ref }}

      - name: Find changes (push)
        if: github.event_name != 'pull_request'
        run: |
          echo "test_scope=--all" >> "$GITHUB_ENV"

      - name: Run chart-testing (lint)
        if: env.test_scope != ''
        run: |
          $DOCKER_COMMAND -v $(pwd):/data --user $(id -u) $CT_IMAGE \
              ct lint $test_scope --validate-maintainers=false --check-version-increment=false

      - name: Set up Helm
        if: env.test_scope != ''
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create kind cluster
        if: env.test_scope != ''
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Run chart-testing (install)
        if: env.test_scope != ''
        run: |
          $DOCKER_COMMAND -v $(pwd):/data -v ~/.kube/config:/root/.kube/config:ro $CT_IMAGE \
              ct install --all
